server.port=8318
server.address=127.0.0.1
http.max-request-body-size=16777216
http.multipart.max-request-size=33554432
http.request.printReport=false
proxy.data-dir=data
proxy.capture.max-bytes=4194304

# Per-attempt header wait and body inactivity limits; healthy streams have no total deadline.
proxy.upstream.header-timeout-seconds=180
proxy.upstream.idle-timeout-seconds=300
